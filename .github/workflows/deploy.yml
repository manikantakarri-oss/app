# Deploy (or roll back) one release of the Agent Portal to one client.
# Started by the Portal Deployer; can also be run by hand from the Actions tab.
# The steps live in deploy-one.yml, shared with rollout.yml.
name: Deploy to client
run-name: "${{ inputs.action }} ${{ inputs.version }} to ${{ inputs.client }} [${{ inputs.deploy_id }}]"

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client environment, e.g. client-acme"
        required: true
        type: string
      version:
        description: "Release tag, e.g. v1.4.0"
        required: true
        type: string
      action:
        description: "deploy, rollback, or uninstall (take the portal out of the client's workspace)"
        required: true
        type: choice
        options: [deploy, rollback, uninstall]
        default: deploy
      deploy_id:
        description: "Id for the deployment record (the deployer fills it in; any UUID by hand)"
        required: true
        type: string
      actor:
        description: "Who asked (the deployer fills it in)"
        required: false
        type: string
        default: ""
      purge:
        description: "uninstall only: 'history' also deletes the chat history and logs"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-one.yml
    with:
      client: ${{ inputs.client }}
      version: ${{ inputs.version }}
      action: ${{ inputs.action }}
      deploy_id: ${{ inputs.deploy_id }}
      actor: ${{ inputs.actor }}
      purge: ${{ inputs.purge }}
    secrets: inherit
